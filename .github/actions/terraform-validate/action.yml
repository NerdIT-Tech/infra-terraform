name: Terraform validate
description: >-
  Runs `terraform validate` against the current working directory.
  Precondition: some prior step in this job must have already run
  `terraform init` (e.g. the terraform-init-no-backend action) -- validate
  reads the `.terraform/` directory that init populates and doesn't create
  it itself. Requires the calling job to have already run actions/checkout.

inputs:
  terraform-version:
    description: Terraform version to install (hashicorp/setup-terraform).
    required: true
  working-directory:
    description: Terraform root to validate.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: terraform validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate
