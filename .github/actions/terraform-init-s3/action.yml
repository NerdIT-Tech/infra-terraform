name: Terraform init (S3 backend, OIDC)
description: >-
  Convenience wrapper for the common case across every repo here: state
  lives in the S3 native-locking backend, reached by assuming an AWS role
  over OIDC. Composes aws-actions/configure-aws-credentials (assumes the
  role) and the terraform-init action (builds the -backend-config= flags
  and runs `terraform init`) so callers don't have to wire both by hand.
  Use terraform-init directly instead of this for the no-backend / local-
  validation case, or if a project ever needs a non-S3 backend. Requires
  the calling job to have already run actions/checkout -- like any local
  action, this one has to be resolvable on disk before it can run.

inputs:
  terraform-version:
    description: Terraform version to install (hashicorp/setup-terraform).
    required: true
  role-to-assume:
    description: ARN of the AWS role to assume over OIDC.
    required: true
  aws-region:
    description: AWS region for both the STS assume-role call and the S3 backend.
    required: true
  state-bucket:
    description: S3 bucket holding the Terraform state object.
    required: true
  state-key:
    description: Key of the state object within the bucket.
    required: false
    default: terraform.tfstate
  use-lockfile:
    description: Use the S3 backend's native locking (use_lockfile).
    required: false
    default: "true"
  working-directory:
    description: Terraform root to initialize.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - uses: ./.github/actions/terraform-init
      with:
        terraform-version: ${{ inputs.terraform-version }}
        working-directory: ${{ inputs.working-directory }}
        args: >-
          -backend-config=bucket=${{ inputs.state-bucket }}
          -backend-config=key=${{ inputs.state-key }}
          -backend-config=region=${{ inputs.aws-region }}
          -backend-config=use_lockfile=${{ inputs.use-lockfile }}
