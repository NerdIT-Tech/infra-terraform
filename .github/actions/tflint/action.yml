name: tflint
description: >-
  Runs tflint's own plugin init followed by a recursive lint pass. Doesn't
  need Terraform installed at all -- tflint is a standalone binary, fully
  independent of the fmt/init/validate chain. Requires the calling job to
  have already run actions/checkout.

inputs:
  tflint-version:
    description: tflint version to install, or "latest".
    required: false
    default: latest
  recursive:
    description: Process subdirectories too (--recursive).
    required: false
    default: "true"
  working-directory:
    description: Terraform root to lint.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: terraform-linters/setup-tflint@v6
      with:
        tflint_version: ${{ inputs.tflint-version }}

    - name: tflint init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tflint --init

    - name: tflint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tflint ${{ inputs.recursive == 'true' && '--recursive' || '' }}
