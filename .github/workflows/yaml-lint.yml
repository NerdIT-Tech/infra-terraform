name: YAML Lint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "**.yml"
      - "**.yaml"

concurrency:
  group: yaml-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-yaml:
    name: Lint YAML
    # Pinned by commit SHA -- see conventional-commits.yml for why.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-yaml-lint.yml@d2e8e341f3c86067944425fdc3aa9c400edd2c4a
    permissions:
      contents: read
