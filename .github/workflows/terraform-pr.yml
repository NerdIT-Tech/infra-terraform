name: Terraform PR

on:
  # No path filter: the `plan` job's "Plan" status is a required status
  # check (repositories.tf), and a path-filtered workflow that never runs
  # doesn't report it at all -- leaving workflow/docs-only PRs permanently
  # unreported and forcing a manual bypass. Running on every PR (with the
  # plan/validate jobs short-circuiting to a cheap no-op when no terraform
  # files changed, via the paths-filter step below) means "Plan" always
  # reports. This is a strict superset of terraform-apply.yml's own filter,
  # preserving ADR-0015's guarantee (any apply-able PR was always planned).
  pull_request:

# Shared with terraform-apply.yml. State locking is now handled natively by
# the S3 backend's `use_lockfile` conditional writes (ADR-0010), so this is
# no longer the only thing preventing corruption -- kept anyway so a PR plan
# and an apply don't pile up waiting on each other's lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format, validate, lint, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect terraform changes
        id: tf-changed
        uses: dorny/paths-filter@v4
        with:
          filters: |
            terraform:
              - "**.tf"
              - ".terraform.lock.hcl"
              - ".tflint.hcl"

      # Composite actions below are pinned to NerdIT-Tech/.github's floating
      # major-version tags (its own convention -- see its
      # .github/actions/README.md), not a commit SHA: unlike the reusable
      # workflows in conventional-commits.yml/yaml-lint.yml/actionlint.yml,
      # every composite action here is a release-please package with real
      # version tags. Each is a direct, behavior-preserving port of this
      # repo's former local action of the same name (#58).
      #
      # terraform-lint-scan/v1 (>= the terraform-lint-scan/v1.0.1 fix)
      # references its own sibling actions (terraform-fmt, terraform-init,
      # terraform-validate, tflint) fully-qualified against NerdIT-Tech/.github
      # instead of ./-relative, so none of those four need a local copy here
      # -- see ADR-0021 for why a composite action's ./-relative uses:
      # resolves against the top-level caller's checkout, not the repo that
      # hosts the composite action, and why that briefly required keeping
      # local copies of all four (NerdIT-Tech/.github#36).
      - uses: NerdIT-Tech/.github/.github/actions/terraform-lint-scan@terraform-lint-scan/v1
        if: steps.tf-changed.outputs.terraform == 'true'
        with:
          terraform-version: ${{ env.TF_VERSION }}

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GITHUB_APP_ID: ${{ vars.TF_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PEM_FILE: ${{ secrets.TF_GITHUB_APP_PEM }}
      # ci-roles.tf (ADR-0019) looks up the state bucket by name -- no
      # default, since it's account-specific, same as TF_STATE_BUCKET below.
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect terraform changes
        id: tf-changed
        uses: dorny/paths-filter@v4
        with:
          filters: |
            terraform:
              - "**.tf"
              - ".terraform.lock.hcl"
              - ".tflint.hcl"

      # Read-only role (bootstrap/main.tf's `plan` role): can read state and
      # take/release the lock, but has no S3 write permission at all -- a PR
      # plan can't corrupt state no matter what it plans (ADR-0010).
      - uses: NerdIT-Tech/.github/.github/actions/terraform-init-s3@terraform-init-s3/v1
        if: steps.tf-changed.outputs.terraform == 'true'
        with:
          terraform-version: ${{ env.TF_VERSION }}
          role-to-assume: ${{ vars.TF_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - id: plan
        if: steps.tf-changed.outputs.terraform == 'true'
        timeout-minutes: 5
        uses: NerdIT-Tech/.github/.github/actions/terraform-plan@terraform-plan/v1

      # Only run when a lock could have been taken (i.e. a real plan step
      # ran). On a skipped/no-op plan nothing was ever locked, and the normal
      # success/failure path of a real plan already released its own S3
      # native lock (ADR-0010) -- this only matters for a plan step that was
      # killed by cancellation or the timeout above.
      - uses: NerdIT-Tech/.github/.github/actions/terraform-release-lock@terraform-release-lock/v1
        if: ${{ always() && steps.tf-changed.outputs.terraform == 'true' }}
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          aws-region: ${{ vars.AWS_REGION }}

      # Saved so a merge of this PR can apply exactly what was reviewed
      # here instead of re-planning after merge (see terraform-apply.yml).
      - name: Upload plan artifact
        if: steps.plan.outputs.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ steps.plan.outputs.out-file }}
          retention-days: 5
