name: Terraform PR

on:
  pull_request:
    # Must stay a superset of terraform-apply.yml's own path filter -- any
    # PR that would trigger an apply on merge has to trigger a plan here
    # first, or terraform-apply.yml resolves a merged PR with no reviewed
    # tfplan artifact to reuse (ADR-0004) and fails trying to download one.
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform-pr.yml"
      - ".github/workflows/terraform-apply.yml"

# Shared with terraform-apply.yml. State locking is now handled natively by
# the S3 backend's `use_lockfile` conditional writes (ADR-0010), so this is
# no longer the only thing preventing corruption -- kept anyway so a PR plan
# and an apply don't pile up waiting on each other's lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format, validate, lint, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Composite actions below are pinned to NerdIT-Tech/.github's floating
      # major-version tags (its own convention -- see its
      # .github/actions/README.md), not a commit SHA: unlike the reusable
      # workflows in conventional-commits.yml/yaml-lint.yml/actionlint.yml,
      # every composite action here is a release-please package with real
      # version tags. Each is a direct, behavior-preserving port of this
      # repo's former local action of the same name (#58).
      #
      # terraform-lint-scan internally does `uses: ./.github/actions/{
      # terraform-fmt,terraform-init,terraform-validate,tflint}` -- and a
      # composite action's `./`-relative uses:, like a reusable workflow's,
      # ALWAYS resolves against the top-level caller's checkout (this repo),
      # never against the repo that hosts the composite action itself. So
      # those four local actions have to stay even though terraform-lint-scan
      # no longer runs from here (see ADR-0021 -- this cost a broken CI run
      # to learn).
      - uses: NerdIT-Tech/.github/.github/actions/terraform-lint-scan@terraform-lint-scan/v1
        with:
          terraform-version: ${{ env.TF_VERSION }}

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GITHUB_APP_ID: ${{ vars.TF_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PEM_FILE: ${{ secrets.TF_GITHUB_APP_PEM }}
      # ci-roles.tf (ADR-0019) looks up the state bucket by name -- no
      # default, since it's account-specific, same as TF_STATE_BUCKET below.
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      # Read-only role (bootstrap/main.tf's `plan` role): can read state and
      # take/release the lock, but has no S3 write permission at all -- a PR
      # plan can't corrupt state no matter what it plans (ADR-0010).
      - uses: NerdIT-Tech/.github/.github/actions/terraform-init-s3@terraform-init-s3/v1
        with:
          terraform-version: ${{ env.TF_VERSION }}
          role-to-assume: ${{ vars.TF_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - id: plan
        timeout-minutes: 5
        uses: NerdIT-Tech/.github/.github/actions/terraform-plan@terraform-plan/v1

      - uses: NerdIT-Tech/.github/.github/actions/terraform-release-lock@terraform-release-lock/v1
        if: always()
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          aws-region: ${{ vars.AWS_REGION }}

      # Saved so a merge of this PR can apply exactly what was reviewed
      # here instead of re-planning after merge (see terraform-apply.yml).
      - name: Upload plan artifact
        if: steps.plan.outputs.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ steps.plan.outputs.out-file }}
          retention-days: 5
