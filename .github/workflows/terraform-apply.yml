name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: {}

# Shared with terraform-pr.yml. State locking is now handled natively by
# the S3 backend's `use_lockfile` conditional writes (ADR-0010), so this is
# no longer the only thing preventing corruption -- kept anyway so a PR plan
# and an apply don't pile up waiting on each other's lock.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_PLAN_FILE: "tfplan"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
    env:
      GITHUB_APP_ID: ${{ vars.TF_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PEM_FILE: ${{ secrets.TF_GITHUB_APP_PEM }}
      # ci-roles.tf (ADR-0019) looks up the state bucket by name -- no
      # default, since it's account-specific, same as TF_STATE_BUCKET below.
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      # Composite actions below are ported to NerdIT-Tech/.github and pinned
      # to its floating major-version tags (see terraform-pr.yml for the
      # general rationale, #58). resolve-pr is the one exception: only its
      # exact resolve-pr/v1.0.0 tag exists upstream so far, no floating
      # resolve-pr/v1 major tag yet -- pin to the exact tag until that
      # appears, then switch to resolve-pr/v1 like the others below.
      - id: resolve
        uses: NerdIT-Tech/.github/.github/actions/resolve-pr@resolve-pr/v1.0.0

      # Read-only role: this job only reads state (to fmt/refresh a fresh
      # plan on the fallback path) and never writes it -- only the apply
      # job below gets write access (ADR-0010). terraform-init-s3 internally
      # does `uses: ./.github/actions/terraform-init`, which resolves against
      # this repo's checkout -- that's why terraform-init stays local (see
      # terraform-pr.yml, ADR-0021).
      - uses: NerdIT-Tech/.github/.github/actions/terraform-init-s3@terraform-init-s3/v1
        with:
          terraform-version: ${{ env.TF_VERSION }}
          role-to-assume: ${{ vars.TF_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      # Reuse path: this push is a merge of a PR whose terraform-pr.yml run
      # already produced a reviewed tfplan. Download it instead of
      # re-planning, so apply never runs anything that wasn't reviewed.
      - name: Download plan from merged PR
        if: steps.resolve.outputs.pr-number != ''
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: terraform-pr.yml
          pr: ${{ steps.resolve.outputs.pr-number }}
          name: ${{ env.TF_PLAN_FILE }}
          workflow_conclusion: success

      # Fallback path: direct push to main or workflow_dispatch, with no
      # merged PR to source a plan from.
      - id: plan
        if: steps.resolve.outputs.pr-number == ''
        # Bounds a hung plan (seen stuck 31+ min with no bound before) so it
        # fails fast instead of sitting on the shared `terraform-state`
        # concurrency group and blocking every other PR/apply behind it.
        timeout-minutes: 15
        uses: NerdIT-Tech/.github/.github/actions/terraform-plan@terraform-plan/v1
        with:
          out-file: ${{ env.TF_PLAN_FILE }}

      # A plan step that's killed -- by manual cancellation or by the
      # timeout above -- doesn't get to release its own S3 native lock
      # (ADR-0010), leaving the `.tflock` object behind and blocking every
      # later plan/apply. `always()` so this runs on that path too; a
      # normal success/failure already released the lock as part of
      # terraform's own exit, so this is a harmless no-op then. Runs
      # unconditionally -- on the reuse path no lock was ever taken, so
      # this is just a no-op there.
      - uses: NerdIT-Tech/.github/.github/actions/terraform-release-lock@terraform-release-lock/v1
        if: always()
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          aws-region: ${{ vars.AWS_REGION }}

      # Handed to the apply job as artifacts rather than re-reading the
      # cache there, so apply always operates on exactly what was planned
      # and reviewed here — not on whatever the cache happens to hold by
      # the time a reviewer approves.
      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TF_PLAN_FILE }}
          path: ${{ env.TF_PLAN_FILE }}
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      GITHUB_APP_ID: ${{ vars.TF_GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PEM_FILE: ${{ secrets.TF_GITHUB_APP_PEM }}
      # ci-roles.tf (ADR-0019) looks up the state bucket by name -- no
      # default, since it's account-specific, same as TF_STATE_BUCKET below.
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      # Read-write role: only this job ever gets S3 write access, and only
      # on main under the `production` environment gate (ADR-0010).
      - uses: NerdIT-Tech/.github/.github/actions/terraform-init-s3@terraform-init-s3/v1
        with:
          terraform-version: ${{ env.TF_VERSION }}
          role-to-assume: ${{ vars.TF_AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.TF_PLAN_FILE }}

      - name: terraform apply
        run: terraform apply -input=false -auto-approve ${{ env.TF_PLAN_FILE }}

  # The PR's sticky plan comment (from terraform-pr.yml) has now been
  # applied and is no longer useful — remove it rather than leave stale
  # plan output sitting on a closed PR.
  cleanup-pr-comment:
    name: Remove sticky plan comment
    needs: [plan, apply]
    if: needs.plan.outputs.pr-number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete sticky plan comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-plan
          number: ${{ needs.plan.outputs.pr-number }}
          delete: true
