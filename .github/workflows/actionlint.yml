name: Actionlint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: actionlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflow files
    # Pinned by commit SHA -- see conventional-commits.yml for why.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-actionlint.yml@3289533fd243ff3fdbc47df296c4f596d546f819
    permissions:
      contents: read
