name: Actionlint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: actionlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflow files
    # Pinned by commit SHA -- see conventional-commits.yml for why.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-actionlint.yml@d2e8e341f3c86067944425fdc3aa9c400edd2c4a
    permissions:
      contents: read
