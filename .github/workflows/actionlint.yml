name: Actionlint

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: actionlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflow files
    # Pinned by commit SHA -- see conventional-commits.yml for why.
    uses: NerdIT-Tech/.github/.github/workflows/reusable-actionlint.yml@c11c34a7f1d44a04587023f859f448b7c12f23ba
    permissions:
      contents: read
